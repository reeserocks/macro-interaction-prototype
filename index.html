<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Macro Interaction Prototype</title>
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="instructions-container">
      <h1 id="instructions">
        Start a test to see the instructions!
      </h1>
    </div>

    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="pose-canvas"></canvas>
      <div id="test-feedback">
        Move into view so I can see your full body.
      </div>
    </div>

    <div class="tests-container">
      <ul>
        <li data-test="walkAndTurn" tabindex="0">Walk-and-Turn</li>
        <li data-test="oneLegStand" tabindex="0">One-Leg Stand</li>
        <li data-test="romberg" tabindex="0">Romberg Balance</li>
        <li data-test="fingerToNose" tabindex="0">Finger to Nose</li>
      </ul>
    </div>
  </body>
</html>
